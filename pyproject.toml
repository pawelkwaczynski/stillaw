[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stillaw"
version = "0.1.1"
description = "Is this still the law? Deterministic currency check for Polish statutes, resolved from the ELI API of the Dziennik Ustaw."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Pawel Kwaczynski" }]
keywords = ["law", "legislation", "eli", "poland", "vacatio-legis", "legal-tech", "mcp", "mcp-server", "agent-tools", "legal-ai", "point-in-time", "statute"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
]
# Standard library only. The ELI client falls back to curl for TLS trust, pdftotext does
# the PDF extraction; both are external binaries, not Python packages.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=1.0"]

[project.urls]
Homepage = "https://github.com/pawelkwaczynski/stillaw"
Repository = "https://github.com/pawelkwaczynski/stillaw"
Issues = "https://github.com/pawelkwaczynski/stillaw/issues"
Changelog = "https://github.com/pawelkwaczynski/stillaw/blob/master/CHANGELOG.md"
"Polish readme" = "https://github.com/pawelkwaczynski/stillaw/blob/master/README.pl.md"

[project.scripts]
stillaw = "stillaw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
